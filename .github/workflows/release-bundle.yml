name: Release Bundle

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Rebuild and attach the bundle for an existing tag, e.g. when the release
  # was published from the GitHub web UI or an earlier run failed. It never
  # creates a tag: the tag must already exist (tags are human-only).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the bundle for (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write # required to create releases and upload assets

jobs:
  build-and-release:
    name: Build and publish release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # needed for git describe

      - name: Resolve version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '$TAG' is not an exact vX.Y.Z tag" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "ERROR: tag ${TAG} does not exist" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}"    >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        run: chmod +x scripts/build-bundle.sh

      - name: Build distribution bundle
        run: ./scripts/build-bundle.sh "${{ steps.version.outputs.version }}"

      - name: Verify bundle and checksum files exist
        run: |
          BUNDLE="dist/dev-tasks-bundle-v${{ steps.version.outputs.version }}.tar.gz"
          CHECKSUM="${BUNDLE}.sha256"
          if [ ! -f "$BUNDLE" ]; then
            echo "ERROR: Bundle file not found: $BUNDLE" >&2
            exit 1
          fi
          if [ ! -f "$CHECKSUM" ]; then
            echo "ERROR: Checksum file not found: $CHECKSUM" >&2
            exit 1
          fi
          echo "Bundle:   $BUNDLE"
          echo "Checksum: $CHECKSUM"
          cat "$CHECKSUM"

      - name: Smoke test — install into a clean temp directory
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          BUNDLE="dist/dev-tasks-bundle-v${{ steps.version.outputs.version }}.tar.gz"

          # Extract the bundle manually and verify key managed files
          tar -xzf "$BUNDLE" -C "$TMPDIR"
          INNER=$(ls -A "$TMPDIR" | head -1)
          SRC="${TMPDIR}/${INNER}"

          echo "Verifying bundle contents ..."
          [ -d "${SRC}/.github/agents" ]       || { echo "Missing .github/agents"; exit 1; }
          [ -d "${SRC}/.github/skills" ]        || { echo "Missing .github/skills"; exit 1; }
          [ -d "${SRC}/.github/instructions" ]  || { echo "Missing .github/instructions"; exit 1; }
          [ -d "${SRC}/.github/prompts" ]       || { echo "Missing .github/prompts"; exit 1; }
          [ -d "${SRC}/.kiro/agents" ]           || { echo "Missing .kiro/agents"; exit 1; }
          [ -d "${SRC}/.kiro/skills" ]           || { echo "Missing .kiro/skills"; exit 1; }
          [ -d "${SRC}/.kiro/steering" ]         || { echo "Missing .kiro/steering"; exit 1; }
          [ -d "${SRC}/.kiro/hooks" ]            || { echo "Missing .kiro/hooks"; exit 1; }
          [ -f "${SRC}/bundle-manifest.json" ]  || { echo "Missing bundle-manifest.json"; exit 1; }
          echo "Bundle structure OK."
          rm -rf "$TMPDIR"

      # A release published from the GitHub web UI already exists when the tag
      # push starts this job: attach the assets to it and keep its notes.
      # Only when no release exists is one made here, with default notes.
      - name: Create GitHub Release or upload assets to the existing one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE="dist/dev-tasks-bundle-v${VERSION}.tar.gz"
          CHECKSUM="${BUNDLE}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading assets and keeping its notes."
            gh release upload "$TAG" "$BUNDLE" "$CHECKSUM" --clobber
            exit 0
          fi

          # Build release notes
          NOTES=$(cat <<EOF
          ## dev-tasks v${VERSION}

          ### Install via npm

          \`\`\`bash
          pnpm add -g @llipe.com/dev-tasks@${VERSION}
          \`\`\`

          Then install agent files into your repo:

          \`\`\`bash
          dev-tasks install
          \`\`\`

          ### Bundle (manual)

          Download the tarball from this release if you prefer manual installation.

          See the [README](https://github.com/llipe/dev-tasks#readme) for full documentation.
          EOF
          )

          gh release create "$TAG" \
            --title "dev-tasks ${TAG}" \
            --notes "$NOTES" \
            "$BUNDLE" \
            "$CHECKSUM"
