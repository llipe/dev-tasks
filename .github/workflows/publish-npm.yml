name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # Trusted publishing (OIDC) requires npm >= 11.5.1 and Node >= 22.14.
      # Node 24 bundles npm 11.x but not necessarily >= 11.5.1, so upgrade explicitly.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "WARNING: package.json version ($PKG_VERSION) differs from tag ($TAG_VERSION). Updating."
            pnpm pkg set version="$TAG_VERSION"
          else
            echo "package.json version matches tag: $TAG_VERSION"
          fi

      - name: Run quality gates
        run: pnpm run validate

      - name: Build
        run: pnpm run build

      - name: Verify dist output
        run: |
          [ -f dist/bin/dev-tasks.js ] || { echo "Missing dist/bin/dev-tasks.js"; exit 1; }
          [ -f dist/bin/dt.js ]        || { echo "Missing dist/bin/dt.js"; exit 1; }
          [ -d dist/core ]             || { echo "Missing dist/core/"; exit 1; }
          [ -d dist/adapters ]         || { echo "Missing dist/adapters/"; exit 1; }
          echo "dist/ structure OK"

      - name: Dry-run pack to verify contents
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --ignore-scripts
