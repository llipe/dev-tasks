name: Validate

# Runs the repository's quality gate on every pull request, whatever its base
# branch — integration-branch PRs are where a batch is assembled, so they need
# the check as much as PRs into the default branch. Making this check required
# is a repository-settings action: see
# docs/runbooks/runbook-configure-branch-protection.md.
# Runbook: docs/runbooks/runbook-diagnose-pr-validate.md

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: pnpm run validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm run validate
