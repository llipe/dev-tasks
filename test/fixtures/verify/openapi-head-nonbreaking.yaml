openapi: "3.0.3"
info:
  title: Test API
  version: "1.1.0"
paths:
  /users:
    get:
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, pending, archived]
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                email:
                  type: string
                avatar_url:
                  type: string
      responses:
        "201":
          description: Created
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
  /health:
    get:
      responses:
        "200":
          description: OK
