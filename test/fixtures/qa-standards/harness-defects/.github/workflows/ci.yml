name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Defect 5: CI pins different runtimes than .tool-versions declares locally.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm test
